<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 20px;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  table {
    border-collapse: collapse;
    width: 900px;
    border: 1px solid #d0d7de;
  }
  td {
    border: 1px solid #d0d7de;
    padding: 16px;
    vertical-align: top;
  }
</style>
</head>
<body>
<table>
<tr>
<td width="65%" valign="top" align="center">
  <img id="left-typing" src="assets/typing-light.svg" width="100%" style="display:block;" />
  <div style="height: 10px;"></div>
  <img id="left-stats" src="assets/stats-card-light.svg" width="100%" style="display:block;" />
</td>
<td width="35%" valign="top" align="center">
  <img id="right-gif" src="assets/giphy-light.webp" width="100%" style="display:block;" />
</td>
</tr>
</table>

<script>
  window.addEventListener('load', () => {
    const t = document.getElementById('left-typing').getBoundingClientRect();
    const s = document.getElementById('left-stats').getBoundingClientRect();
    const g = document.getElementById('right-gif').getBoundingClientRect();
    console.log(JSON.stringify({
      left_top: t.top,
      left_bottom: s.bottom,
      left_total_height: s.bottom - t.top,
      right_top: g.top,
      right_bottom: g.bottom,
      right_total_height: g.bottom - g.top,
      difference: (s.bottom - t.top) - (g.bottom - g.top)
    }));
  });
</script>
</body>
</html>
