<svg xmlns="http://www.w3.org/2000/svg" width="124" height="34" viewBox="0 0 124 34">
  <defs>
    <style>
      .btn-label {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.8px;
        fill: #000000;
      }
    </style>
  </defs>

  <!-- Brutalist Hard Block Shadow -->
  <rect x="3" y="3" width="120" height="30" fill="#000000" shape-rendering="crispEdges" />

  <!-- Main Button Container -->
  <rect x="0" y="0" width="120" height="30" fill="#FFFFFF" stroke="#000000" stroke-width="2" shape-rendering="crispEdges" />

  <!-- Left Icon Accent Box -->
  <rect x="0" y="0" width="30" height="30" fill="#FFE600" stroke="#000000" stroke-width="2" shape-rendering="crispEdges" />

  <!-- Centered Icon (18x18 inside 30x30 on integer coords) -->
  <svg x="6" y="6" width="18" height="18" viewBox="0 0 24 24" fill="#000000" stroke="#000000">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 0c3 3 5 7 5 10s-2 7-5 10m0-20c-3 3-5 7-5 10s2 7 5 10M2 12h20"/>
  </svg>

  <!-- Button Text -->
  <text class="btn-label" x="75" y="15" text-anchor="middle" dominant-baseline="central">PORTFOLIO</text>
</svg>