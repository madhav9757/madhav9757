name: 🎬 Rotate Intro GIF

on:
  schedule:
    # Run every 5 hours
    - cron: "0 */5 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  rotate-gif:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"
          cache: true

      - name: 🎬 Run GIF Rotator
        run: |
          cd .automation/gif-rotator
          go run main.go

      - name: 📊 Check for Changes
        id: check_changes
        run: |
          if git diff --quiet static/intro.gif .automation/gif-rotator/rotation-state.txt; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: 💾 Commit & Push Changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GIF Rotator Bot"
          git add static/intro.gif .automation/gif-rotator/rotation-state.txt
          git commit -m "🎬 Auto-rotate intro GIF [skip ci]"
          git push

      - name: ✅ Rotation Complete
        if: steps.check_changes.outputs.changed == 'true'
        run: echo "✨ GIF successfully rotated and committed!"

      - name: ⏸️ No Rotation Needed
        if: steps.check_changes.outputs.changed == 'false'
        run: echo "⏸️ Not time to rotate yet"
